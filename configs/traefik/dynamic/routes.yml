# Traefik Dynamic Routing Configuration
# falcon-gateway/configs/traefik/dynamic/routes.yml

http:
  # ============================================
  # ROUTERS
  # ============================================
  routers:
    # Trading Portal (main site)
    dashboard:
      rule: "Host(`localhost`) || Host(`falcon.localhost`)"
      service: dashboard-svc
      entryPoints:
        - web
      middlewares:
        - dashboard-auth

    # Infrastructure Admin (status page)
    admin:
      rule: "Host(`admin.falcon.localhost`)"
      service: website-svc
      entryPoints:
        - web

    # Traefik Dashboard (internal)
    traefik-api:
      rule: "Host(`traefik.localhost`)"
      service: api@internal
      entryPoints:
        - web

    # Consul UI
    consul:
      rule: "Host(`consul.localhost`)"
      service: consul-svc
      entryPoints:
        - web

    # Prometheus
    prometheus:
      rule: "Host(`prometheus.localhost`)"
      service: prometheus-svc
      entryPoints:
        - web

    # Grafana
    grafana:
      rule: "Host(`grafana.localhost`)"
      service: grafana-svc
      entryPoints:
        - web

    # ------------------------------------------------
    # LAN path routers
    #
    # Reachable as http://<lan-ip>:8880/<tool> from machines where the
    # *.localhost Host() rules above do not resolve.
    #
    # Explicit priority 10: above the catch-all (1) so these win for their
    # own prefixes, and below every Host() router (Traefik derives those
    # priorities from rule length, the shortest here being 24) so existing
    # hostname routing is unchanged.
    # ------------------------------------------------
    grafana-path:
      rule: "PathPrefix(`/grafana`)"
      priority: 10
      service: grafana-svc
      entryPoints:
        - web
      middlewares:
        - strip-grafana

    prometheus-path:
      rule: "PathPrefix(`/prometheus`)"
      priority: 10
      service: prometheus-svc
      entryPoints:
        - web
      middlewares:
        - strip-prometheus

    consul-path:
      rule: "PathPrefix(`/consul`)"
      priority: 10
      service: consul-svc
      entryPoints:
        - web
      middlewares:
        - strip-consul

    # ------------------------------------------------
    # LAN catch-all -- MUST remain the lowest-priority router.
    # Anything not claimed by a Host() or path router above falls through
    # to the trading dashboard, so http://<lan-ip>:8880/ answers instead
    # of returning Traefik's default 404.
    # ------------------------------------------------
    lan-catchall:
      rule: "PathPrefix(`/`)"
      priority: 1
      service: dashboard-svc
      entryPoints:
        - web
      middlewares:
        - dashboard-auth

  # ============================================
  # SERVICES
  # ============================================
  services:
    website-svc:
      loadBalancer:
        servers:
          - url: "http://falcon-website:80"

    consul-svc:
      loadBalancer:
        servers:
          - url: "http://falcon-consul:8500"

    prometheus-svc:
      loadBalancer:
        servers:
          - url: "http://falcon-prometheus:9090"

    grafana-svc:
      loadBalancer:
        servers:
          - url: "http://falcon-grafana:3000"

    dashboard-svc:
      loadBalancer:
        servers:
          # falcon-trader ships the Flask dashboard under the container
          # name falcon-trader; there is no falcon-dashboard container.
          - url: "http://falcon-trader:5000"

  # ============================================
  # MIDDLEWARES
  # ============================================
  middlewares:
    # Rate limiting
    ratelimit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m

    # Security headers
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true

    # Basic auth in front of the trading dashboard (falcon-trader#25).
    # The users file is NOT in git. Copy users.htpasswd.example to
    # users.htpasswd next to this file and generate real entries with:
    #   htpasswd -nbB <user> <password>
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/dynamic/users.htpasswd

    # Prefix stripping for the LAN path routers
    strip-grafana:
      stripPrefix:
        prefixes:
          - /grafana

    strip-prometheus:
      stripPrefix:
        prefixes:
          - /prometheus

    strip-consul:
      stripPrefix:
        prefixes:
          - /consul
